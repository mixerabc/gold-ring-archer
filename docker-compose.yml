services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      CORS_ORIGIN: http://localhost:8081
    ports:
      - '8080:8080'
    volumes:
      - gold-ring-data:/app/data
    restart: unless-stopped

  client:
    image: nginx:1.27-alpine
    depends_on:
      - server
    ports:
      - '8081:80'
    volumes:
      - ./client/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  gold-ring-data:
