# Render blueprint for the authoritative server.
# Deploy the static client to Netlify or Vercel and point VITE_API_URL here.
services:
  - type: web
    name: gold-ring-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATA_DIR
        value: /app/data
      - key: CORS_ORIGIN
        sync: false
    # Free instances have ephemeral storage. On a paid plan, add:
    # disk:
    #   name: gold-ring-data
    #   mountPath: /app/data
    #   sizeGB: 1
